
# ==========================================
# GENERAL SETTINGS
# ==========================================

#Full-width content Unbind the default Ctrl+b prefix
unbind C-b

# Set the new prefix to Alt+b (Meta+b)
set-option -g prefix M-b

# Allow sending Alt+b to applications by pressing it twice
bind-key M-b send-prefix


# Enable mouse support
set -g mouse on

# Start window and pane numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Increase scrollback history
set -g history-limit 10000
# Use Zsh for new tmux windows and panes
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh


# ==========================================
# STATUS BAR
# ==========================================

set -g status on
set -g status-position bottom
set -g status-interval 5

# Status bar colors
set -g status-style bg=#000000,fg=white

# Window colors
set -g window-status-style bg=black,fg=white
set -g window-status-current-style bg=magenta,fg=black,bold

# Window names and separators
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# Status bar alignment
set -g status-justify left

# Left and right sections
set -g status-left "#[fg=cyan,bold] #S "
set -g status-right "#[fg=cyan] %H:%M %d-%b-%y "


# ==========================================
# PANE NAVIGATION
# ==========================================

# Navigate panes using Vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes
bind | split-window -h
bind - split-window -v

# Preserve current working directory when splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# ==========================================
# PANE RESIZING
# ==========================================

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# ==========================================
# PLUGINS
# ==========================================

# TPM - Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Capture pane contents when saving sessions
set -g @resurrect-capture-pane-contents 'on'


# ==========================================
# INITIALIZE TPM
# KEEP THIS AT THE VERY BOTTOM
# ==========================================

run '~/.tmux/plugins/tpm/tpm'
